           M27.000,21.147 A5.000,5.000 0 1 1 37.000,21.147 A5.000,5.000 0 1 1 40.972,30.276 A5.000,5.000 0 1 1 32.000,34.670 A5.000,5.000 0 1 1 23.028,30.276 A5.000,5.000 0 1 1 27.000,21.147 Z"/>
  <text x="80" y="26" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.8" fill="#DBEAFE">ASILO DE ANCIANOS</text>
  <text x="80" y="49" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#FFFFFF">Cabeza de Algodón</text>
