<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Asilo de Ancianos Cabeza de Algodon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Asilo de Ancianos Cabeza de Algodon
     Isotipo: corazon (cuidado) con una mota de algodon calada en negativo.
     Una sola forma compuesta con fill-rule="evenodd": el algodon es un hueco real,
     por lo que basta cambiar el atributo fill para recolorear todo el logo. -->
