# docker-compose.yml
#
# Las credenciales salen del archivo .env (no versionado), no del código.
# Copie .env.example como .env y complete POSTGRES_PASSWORD antes de levantar.

services:
  db_asilo:
    image: postgres:15-alpine
    container_name: postgres_asilo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_asilo}
      POSTGRES_DB: ${POSTGRES_DB:-asilo_cabeza_algodon}
      # Sin valor por defecto a propósito: si falta el .env, compose falla con
      # este mensaje en vez de crear la base con una credencial vacía.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copie .env.example como .env y complete el valor.}
    ports:
      # Mapeo del puerto local al puerto del contenedor
      - "5433:5432"
    volumes:
      # Volumen para que los datos no se borren si apagas el contenedor
      - asilo_db_data:/var/lib/postgresql/data

volumes:
  asilo_db_data:
