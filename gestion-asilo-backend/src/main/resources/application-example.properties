spring.application.name=gestion-asilo-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/asilo_cabeza_algodon
spring.datasource.username=admin_asilo
# La misma que POSTGRES_PASSWORD en el .env de la raíz.
spring.datasource.password=contrasena_segura
# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration);
# Hibernate solo comprueba que coincida con las entidades (docs/migraciones.md).
spring.jpa.hibernate.ddl-auto=validate
# Para una base de desarrollo creada antes de Flyway: la marca en la versión 1
# en vez de intentar crear tablas que ya existen. En una base nueva no influye.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# DEF-03. Si la base no responde, cada petición espera como máximo 3 s por
# una conexión (HikariCP espera 30 s por defecto) y el usuario recibe el aviso
# de que la base no está disponible.
spring.datasource.hikari.connection-timeout=3000

# YS-170. HS256 exige al menos 32 caracteres (256 bits): con menos, el backend
# no arranca (WeakKeyException). Este valor solo sirve para que la plantilla
# arranque; genere uno propio con: openssl rand -base64 48
jwt.secret=reemplace_esta_clave_por_una_aleatoria_de_al_menos_32_caracteres
# 8 h = 8 x 60 x 60 x 1000 ms: un turno de trabajo (YS-48, ver docs/seguridad.md).
jwt.expiration=28800000
server.port=8080

# YS-170. Primer Administrador del Asilo. Solo se crea cuando la tabla de
# usuarios está vacía, es decir, en el primer arranque contra una base nueva.
# Si la contraseña queda en blanco, se genera una al azar y aparece una sola vez
# en el log de arranque. En los dos casos el sistema exige cambiarla en el
# primer inicio de sesión (YS-69 y YS-74, ver docs/seguridad.md).
app.admin-inicial.correo=admin@asilo.gt
app.admin-inicial.password=

# YS-96. Correo al familiar (RF-04). Sin estas líneas el backend usa Mailpit en
# localhost:1025, que es lo que levanta docker-compose.yml. Para un servidor
# real, por ejemplo:
#   spring.mail.host=smtp.ejemplo.com
#   spring.mail.port=587
#   spring.mail.username=avisos@ejemplo.com
#   spring.mail.password=contraseña_de_aplicación
#   spring.mail.properties.mail.smtp.starttls.enable=true
app.correo.remitente=no-responder@cabezadealgodon.test
# Nombre del remitente de los correos: no se define aquí a propósito. Su valor
# por defecto está en NotificacionService. Spring Boot lee los .properties como
# ISO-8859-1: una tilde o una ñ en un valor sale mal («AlgodÃ³n»). En los
# comentarios no importa.

# YS-95. Reintento automático de los avisos fallidos: cada 10 min, hasta 5 veces.
app.notificaciones.reintento-ms=600000
app.notificaciones.max-intentos=5

# YS-117. Carpeta de los archivos de los resultados de laboratorio (HU-13).
# Sin esta línea van a .asilo/archivos dentro de la carpeta del usuario. El
# tamaño máximo por archivo es de 10 MB (ArchivosConfig).
# app.archivos.directorio=C:/asilo/archivos
