spring.application.name=gestion-asilo-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/asilo_cabeza_algodon
spring.datasource.username=admin_asilo
spring.datasource.password=contraseña_segura
spring.jpa.hibernate.ddl-auto=update

jwt.secret=una_clave_larga_y_aleatoria
# 8 h = 8 x 60 x 60 x 1000 ms: un turno de trabajo (YS-48, ver docs/seguridad.md).
jwt.expiration=28800000
server.port=8080

# YS-96. Correo al familiar (RF-04). Sin estas líneas el backend usa Mailpit en
# localhost:1025, que es lo que levanta docker-compose.yml. Para un servidor
# real, por ejemplo:
#   spring.mail.host=smtp.ejemplo.com
#   spring.mail.port=587
#   spring.mail.username=avisos@ejemplo.com
#   spring.mail.password=contraseña_de_aplicación
#   spring.mail.properties.mail.smtp.starttls.enable=true
app.correo.remitente=no-responder@cabezadealgodon.test
app.correo.remitente-nombre=Asilo de Ancianos Cabeza de Algodón

# YS-95. Reintento automático de los avisos fallidos: cada 10 min, hasta 5 veces.
app.notificaciones.reintento-ms=600000
app.notificaciones.max-intentos=5