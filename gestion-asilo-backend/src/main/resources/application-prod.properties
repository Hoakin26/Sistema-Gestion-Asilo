# YS-174. Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod
# (docker-compose.prod.yml).
#
# Va versionado porque no tiene secretos. La base de datos, el secreto JWT, el
# correo y el administrador inicial llegan como variables de entorno desde el
# .env.prod del servidor (ver .env.prod.example en la raíz del repositorio).
spring.application.name=gestion-asilo-backend

# El esquema lo mantiene Hibernate, igual que en desarrollo. "update" agrega
# tablas y columnas pero nunca borra: por eso se respalda la base antes de cada
# despliegue (docs/fase-diseno.md, 2.5).
spring.jpa.hibernate.ddl-auto=update

# 8 h, un turno de trabajo (YS-48). JWT_EXPIRATION lo cambia sin reconstruir.
jwt.expiration=28800000

# Actuator: solo el indicador de salud, en /api/actuator para que Caddy lo
# reenvíe al backend. Lo consulta UptimeRobot cada 5 minutos (RNF-05). Sin
# detalles: el estado de la base o del disco no le incumbe a quien pregunta
# desde fuera, así que solo responde {"status":"UP"} o "DOWN".
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Spring Boot 4 activa por defecto los grupos "liveness" y "readiness" de
# Kubernetes, y los anuncia en la respuesta. Aquí no hay Kubernetes: fuera.
management.endpoint.health.probes.enabled=false
# El correo no cuenta para la salud: si el servidor de correo falla, el sistema
# sigue atendiendo y los avisos se reintentan solos (RF-04). Una alarma de
# UptimeRobot por eso sería falsa.
management.health.mail.enabled=false

# Archivos subidos (resultados de laboratorio, HU-13): hasta 10 MB cada uno.
# La petición completa lleva además los datos del resultado, de ahí el margen.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Detrás de Caddy, la dirección del cliente y el esquema (https) llegan en las
# cabeceras X-Forwarded-*. Tomcat solo las acepta si la petición viene de la red
# interna, que es donde está Caddy, y Caddy reemplaza las que mande el cliente:
# desde fuera no se pueden falsificar. Ver RegistroAccesoDenegado.
server.forward-headers-strategy=native
